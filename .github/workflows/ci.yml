name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-reference:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --extra dev --locked

      - name: Verify repository and shared conformance vectors
        run: |
          uv run --locked --extra dev python scripts/verify_repo.py
          uv run --locked --extra dev python scripts/regenerate_conformance_fixtures.py --check
          uv run --locked --extra dev python scripts/regenerate_m2_fixtures.py --check
          uv run --locked --extra dev python scripts/regenerate_demo_docs.py --check
          uv run --locked --extra dev python -m ruff check src tests scripts
          uv run --locked --extra dev python -m ruff format --check src tests scripts
          uv run --locked --extra dev python -m pyright
          uv run --locked --extra dev python -m unittest discover -s tests -v
          uv run --locked --extra dev python -m variaxiom --home .variaxiom demo --reset
          uv run --locked --extra dev python -m variaxiom --home .variaxiom verify

      - name: Upload the inspectable Authority Test report
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authority-test-report
          path: .variaxiom/reports/
          if-no-files-found: error
          retention-days: 14

  rust-kernel:
    name: Rust trusted kernel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  required:
    name: Required checks
    if: always()
    needs: [python-reference, rust-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm every matrix completed successfully
        env:
          PYTHON_RESULT: ${{ needs.python-reference.result }}
          RUST_RESULT: ${{ needs.rust-kernel.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success
