[package]
name = "variaxiom-protocol"
description = "Dependency-light constitutional protocol types for Variaxiom."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Hidden cross-crate typestate used by the unpublished protocol and kernel pair.
kernel-bridge = []
# Test-only history carrier and staged conformance surface.
conformance = ["kernel-bridge"]

[dependencies]
base64 = "0.22"
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "precomputed-tables"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "m2_wire"
required-features = ["conformance"]

[lints]
workspace = true
